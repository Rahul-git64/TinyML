[platformio]
default_envs = xiao_esp32s3_sense

[env:xiao_esp32s3_sense]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_XIAO_PDM_MIC=1
    -DTF_LITE_STATIC_MEMORY
    -DESP_NN
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    espressif/esp-tflite-micro@^1.0.0
    ottowinter/ESPAsyncWebServer-esphome@^3.2.2
    mathieucarbou/AsyncTCP@^3.2.14
    bblanchon/ArduinoJson@^7.2.0

[env:esp32s3_inmp441]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_XIAO_PDM_MIC=0
    -DTF_LITE_STATIC_MEMORY
    -DESP_NN
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    espressif/esp-tflite-micro@^1.0.0
    ottowinter/ESPAsyncWebServer-esphome@^3.2.2
    mathieucarbou/AsyncTCP@^3.2.14
    bblanchon/ArduinoJson@^7.2.0
